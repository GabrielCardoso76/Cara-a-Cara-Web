<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainstorm de Nomes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .filter-btn.active {
            background-color: #4f46e5; /* Indigo 600 */
            color: white;
        }
        .name-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

<div id="app" class="container mx-auto p-4 md:p-8">
    <!-- Cabeçalho -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b pb-4">
        <h1 class="text-3xl font-bold text-gray-800 mb-4 md:mb-0">Brainstorm de Nomes</h1>
        <div id="user-info" class="text-right">
            <p class="text-sm text-gray-600">Logado como:
                <span class="font-semibold text-indigo-600" th:text="${username}">Usuário</span>
            </p>
        </div>
    </header>

    <!-- Formulário de Sugestão -->
    <section id="suggestion-form-section" class="mb-10">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-2xl font-semibold mb-4 text-gray-700">Sugerir um Novo Nome</h2>
            <form th:action="@{/sugerir}" method="post">
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="text" id="name-suggestion" name="nome" class="flex-grow px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Digite sua ideia de nome..." required>
                    <button type="submit" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition-colors font-semibold">Sugerir</button>
                </div>
            </form>
        </div>
    </section>

    <!-- Filtros e Lista -->
    <section id="ranking-section">
        <div class="flex flex-wrap gap-3 md:gap-4 mb-6 items-center">
            <h3 class="text-xl font-semibold text-gray-700 mr-4">Ranking</h3>
            <a th:href="@{/}" th:classappend="${activeFilter == 'all'} ? 'active'" class="filter-btn px-4 py-2 rounded-full text-sm font-medium transition-colors hover:bg-gray-200">Todos</a>
            <a th:href="@{/filter(by='domain')}" th:classappend="${activeFilter == 'domain'} ? 'active'" class="filter-btn px-4 py-2 rounded-full text-sm font-medium transition-colors hover:bg-gray-200">✅ Domínio Disponível</a>
            <a th:href="@{/filter(by='inpi')}" th:classappend="${activeFilter == 'inpi'} ? 'active'" class="filter-btn px-4 py-2 rounded-full text-sm font-medium transition-colors hover:bg-gray-200">✅ Marca Disponível</a>
            <a th:href="@{/filter(by='recent')}" th:classappend="${activeFilter == 'recent'} ? 'active'" class="filter-btn px-4 py-2 rounded-full text-sm font-medium transition-colors hover:bg-gray-200">Mais Recentes</a>
        </div>

        <!-- Lista de Nomes -->
        <div id="names-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Card de Nome (Renderizado pelo Thymeleaf) -->
            <div th:each="sugestao : ${sugestoes}" class="name-card bg-white p-5 rounded-lg shadow-md flex flex-col justify-between transition-shadow duration-300">
                <div>
                    <h4 class="text-xl font-bold text-gray-800" th:text="${sugestao.nome}"></h4>
                    <p class="text-xs text-gray-500 mb-3">Sugerido por: <span th:text="${sugestao.autor}"></span></p>
                    <div class="space-y-2 text-sm">
                        <p class="flex items-center gap-2" th:classappend="${sugestao.dominioDisponivel} ? 'text-green-600' : 'text-red-600'">
                            <span th:text="${sugestao.dominioDisponivel} ? '✅ Domínio Disponível' : '❌ Domínio Ocupado'"></span>
                        </p>
                        <p class="flex items-center gap-2" th:classappend="${sugestao.inpiDisponivel} ? 'text-green-600' : 'text-red-600'">
                            <span th:text="${sugestao.inpiDisponivel} ? '✅ Marca Disponível' : '❌ Marca com Conflito'"></span>
                        </p>
                    </div>
                </div>
                <div class="flex items-center justify-between mt-4">
                    <div class="flex items-center gap-3">
                        <button class="upvote-btn text-2xl hover:opacity-75 transition-opacity" th:attr="data-id=${sugestao.id}">🔥</button>
                        <span class="vote-count text-lg font-bold text-gray-700" th:text="${sugestao.votos}"></span>
                        <button class="downvote-btn text-2xl hover:opacity-75 transition-opacity" th:attr="data-id=${sugestao.id}">❄️</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const namesList = document.getElementById('names-list');

    namesList.addEventListener('click', (event) => {
        const target = event.target;
        const isUpvote = target.classList.contains('upvote-btn');
        const isDownvote = target.classList.contains('downvote-btn');

        if (!isUpvote && !isDownvote) {
            return;
        }

        const suggestionId = target.dataset.id;
        const url = `/votar/${suggestionId}/${isUpvote ? 'up' : 'down'}`;

        fetch(url, {
            method: 'POST'
        })
        .then(response => {
            if (response.ok) {
                // Atualiza o contador de votos na tela
                const voteCountSpan = target.closest('.flex.items-center.gap-3').querySelector('.vote-count');
                let currentVotes = parseInt(voteCountSpan.textContent, 10);
                voteCountSpan.textContent = isUpvote ? currentVotes + 1 : currentVotes - 1;
            } else if (response.status === 401) {
                alert('Sessão expirada. Por favor, faça login novamente.');
                window.location.href = '/';
            } else {
                alert('Ocorreu um erro ao votar.');
            }
        })
        .catch(error => {
            console.error('Erro ao votar:', error);
            alert('Ocorreu um erro de rede ao votar.');
        });
    });
});
</script>

</body>
</html>
