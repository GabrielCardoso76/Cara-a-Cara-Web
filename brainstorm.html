<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainstorm de Nomes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos para um visual mais limpo e profissional */
        body {
            background-color: #f0f2f5;
        }
        .filter-btn.active {
            background-color: #4f46e5; /* Indigo 600 */
            color: white;
        }
        /* Efeito de hover para os cards */
        .name-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Tela de Login -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gray-200 p-4">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-sm text-center">
            <h1 class="text-2xl font-bold mb-6 text-gray-700">Bem-vindo!</h1>
            <p class="text-gray-600 mb-6">Identifique-se para participar do brainstorm.</p>
            <div class="mb-4 text-left">
                <label for="username" class="block text-sm font-medium text-gray-600 mb-2">Seu Nome</label>
                <input type="text" id="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Digite seu nome de usuário">
            </div>
            <button id="login-button" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition-colors">Entrar</button>
        </div>
    </div>

    <!-- Tela Principal da Aplicação (inicialmente oculta) -->
    <div id="app" class="container mx-auto p-4 md:p-8 hidden">
        <!-- Cabeçalho -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-800 mb-4 md:mb-0">Brainstorm de Nomes</h1>
            <div id="user-info" class="text-right">
                <p class="text-sm text-gray-600">Logado como: <span id="display-username" class="font-semibold text-indigo-600"></span></p>
            </div>
        </header>

        <!-- Formulário de Sugestão -->
        <section id="suggestion-form-section" class="mb-10">
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-2xl font-semibold mb-4 text-gray-700">Sugerir um Novo Nome</h2>
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="text" id="name-suggestion" class="flex-grow px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Digite sua ideia de nome...">
                    <button id="suggest-button" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition-colors font-semibold">Sugerir</button>
                </div>
            </div>
        </section>

        <!-- Filtros e Lista -->
        <section id="ranking-section">
            <div class="flex flex-wrap gap-3 md:gap-4 mb-6 items-center">
                <h3 class="text-xl font-semibold text-gray-700 mr-4">Ranking</h3>
                <button data-filter="all" class="filter-btn active px-4 py-2 rounded-full text-sm font-medium transition-colors">Todos</button>
                <button data-filter="domain" class="filter-btn px-4 py-2 rounded-full text-sm font-medium transition-colors hover:bg-gray-200">✅ Domínio Disponível</button>
                <button data-filter="inpi" class="filter-btn px-4 py-2 rounded-full text-sm font-medium transition-colors hover:bg-gray-200">✅ Marca Disponível</button>
                <button data-filter="recent" class="filter-btn px-4 py-2 rounded-full text-sm font-medium transition-colors hover:bg-gray-200">Mais Recentes</button>
            </div>

            <!-- Lista de Nomes -->
            <div id="names-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards de nomes serão inseridos aqui via JS -->
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- VARIÁVEIS GLOBAIS E ESTADO ---
            let currentUser = localStorage.getItem('brainstorm_username');
            let names = JSON.parse(localStorage.getItem('brainstorm_names')) || [];
            let activeFilter = 'all'; // 'all', 'domain', 'inpi', 'recent'

            // --- ELEMENTOS DO DOM ---
            const loginScreen = document.getElementById('login-screen');
            const appScreen = document.getElementById('app');
            const usernameInput = document.getElementById('username');
            const loginButton = document.getElementById('login-button');
            const displayUsername = document.getElementById('display-username');
            const suggestionInput = document.getElementById('name-suggestion');
            const suggestButton = document.getElementById('suggest-button');
            const namesListContainer = document.getElementById('names-list');
            const filterButtons = document.querySelectorAll('.filter-btn');

            // --- FUNÇÕES ---

            // Salva a lista de nomes no localStorage
            const saveNames = () => {
                localStorage.setItem('brainstorm_names', JSON.stringify(names));
            };

            // Renderiza a lista de nomes na tela, aplicando filtros e ordenação
            const renderNames = () => {
                namesListContainer.innerHTML = ''; // Limpa a lista

                let filteredAndSortedNames = [...names];

                // Aplicar filtro
                if (activeFilter === 'domain') {
                    filteredAndSortedNames = filteredAndSortedNames.filter(n => n.domainStatus.includes('✅'));
                } else if (activeFilter === 'inpi') {
                    filteredAndSortedNames = filteredAndSortedNames.filter(n => n.inpiStatus.includes('✅'));
                }

                // Aplicar ordenação
                if (activeFilter === 'recent') {
                    filteredAndSortedNames.sort((a, b) => b.createdAt - a.createdAt);
                } else {
                    // Padrão (all, domain, inpi) é ordenar por votos
                    filteredAndSortedNames.sort((a, b) => b.votes - a.votes);
                }

                filteredAndSortedNames.forEach(name => {
                    const card = document.createElement('div');
                    card.className = 'name-card bg-white p-5 rounded-lg shadow-md flex flex-col justify-between hover:shadow-xl transition-shadow duration-300';

                    const domainColor = name.domainStatus.includes('✅') ? 'text-green-600' : name.domainStatus.includes('❌') ? 'text-red-600' : 'text-gray-500';
                    const inpiColor = name.inpiStatus.includes('✅') ? 'text-green-600' : name.inpiStatus.includes('❌') ? 'text-red-600' : 'text-gray-500';

                    card.innerHTML = `
                        <div>
                            <h4 class="text-xl font-bold text-gray-800">${name.name}</h4>
                            <p class="text-xs text-gray-500 mb-3">Sugerido por: ${name.author}</p>
                            <div class="space-y-2 text-sm">
                                <p class="flex items-center gap-2 ${domainColor}">${name.domainStatus}</p>
                                <p class="flex items-center gap-2 ${inpiColor}">${name.inpiStatus}</p>
                            </div>
                        </div>
                        <div class="flex items-center justify-between mt-4">
                            <div class="flex items-center gap-3">
                                <button data-id="${name.id}" class="upvote text-2xl hover:opacity-75 transition-opacity">🔥</button>
                                <span class="text-lg font-bold text-gray-700">${name.votes}</span>
                                <button data-id="${name.id}" class="downvote text-2xl hover:opacity-75 transition-opacity">❄️</button>
                            </div>
                        </div>
                    `;
                    namesListContainer.appendChild(card);
                });
            };

            // Função para mostrar a aplicação principal
            const showApp = () => {
                displayUsername.textContent = currentUser;
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                renderNames();
            };

            // Simula a verificação de APIs externas
            const simulateApiChecks = (nameId) => {
                const nameIndex = names.findIndex(n => n.id === nameId);
                if (nameIndex === -1) return;

                setTimeout(() => {
                    names[nameIndex].domainStatus = Math.random() > 0.5 ? '✅ Domínio Disponível' : '❌ Domínio Ocupado';
                    saveNames();
                    renderNames();
                }, 2000);

                setTimeout(() => {
                    names[nameIndex].inpiStatus = Math.random() > 0.5 ? '✅ Marca Disponível' : '❌ Marca com Conflito';
                    saveNames();
                    renderNames();
                }, 3000);
            };

            // --- LÓGICA DE INICIALIZAÇÃO ---
            if (currentUser) {
                showApp();
            }

            // --- EVENT LISTENERS ---
            loginButton.addEventListener('click', () => {
                const username = usernameInput.value.trim();
                if (username) {
                    currentUser = username;
                    localStorage.setItem('brainstorm_username', currentUser);
                    showApp();
                } else {
                    alert('Por favor, digite um nome de usuário.');
                }
            });

            usernameInput.addEventListener('keyup', e => e.key === 'Enter' && loginButton.click());

            suggestButton.addEventListener('click', () => {
                const suggestionText = suggestionInput.value.trim();
                if (!suggestionText) {
                    alert('Por favor, digite uma sugestão de nome.');
                    return;
                }
                const newName = {
                    id: Date.now(),
                    name: suggestionText,
                    author: currentUser,
                    votes: 0,
                    domainStatus: 'Verificando...',
                    inpiStatus: 'Verificando...',
                    createdAt: Date.now()
                };
                names.push(newName);
                saveNames();
                renderNames();
                simulateApiChecks(newName.id);
                suggestionInput.value = '';
                suggestionInput.focus();
            });

            suggestionInput.addEventListener('keyup', e => e.key === 'Enter' && suggestButton.click());

            namesListContainer.addEventListener('click', (e) => {
                const target = e.target;
                const nameId = parseInt(target.dataset.id, 10);
                if (isNaN(nameId)) return;
                const nameIndex = names.findIndex(n => n.id === nameId);
                if (nameIndex === -1) return;
                if (target.classList.contains('upvote')) {
                    names[nameIndex].votes++;
                } else if (target.classList.contains('downvote')) {
                    names[nameIndex].votes--;
                }
                saveNames();
                renderNames();
            });

            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Atualiza o estado do filtro ativo
                    activeFilter = button.dataset.filter;

                    // Atualiza a classe 'active' nos botões
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    // Re-renderiza a lista com o novo filtro
                    renderNames();
                });
            });
        });
    </script>

</body>
</html>
