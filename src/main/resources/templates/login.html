<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Brainstorm de Nomes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div id="login-screen" class="min-h-screen flex items-center justify-center bg-gray-200 p-4">
    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-sm text-center">
        <h1 class="text-2xl font-bold mb-6 text-gray-700">Bem-vindo!</h1>
        <p class="text-gray-600 mb-6">Identifique-se para participar do brainstorm.</p>

        <!-- Formulário de Login -->
        <form action="/login" method="post" th:action="@{/login}">
            <div class="mb-4 text-left">
                <label for="username" class="block text-sm font-medium text-gray-600 mb-2">Seu Nome</label>
                <input type="text" id="username" name="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Digite seu nome de usuário" required>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition-colors">Entrar</button>
        </form>
    </div>
</div>

</body>
</html>
